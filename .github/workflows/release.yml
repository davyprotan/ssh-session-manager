name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            optional: false
          - os: windows-latest
            target: win
            optional: true   # Windows build currently flaky; track via #issue

    runs-on: ${{ matrix.os }}
    # Windows is currently allowed to fail without breaking the release —
    # the macOS .dmg ships regardless and the release-notes job still runs.
    continue-on-error: ${{ matrix.optional == true }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js (macOS)
        if: matrix.target == 'mac'
        run: npm run build

      - name: Build Next.js (Windows)
        if: matrix.target == 'win'
        shell: pwsh
        env:
          HOME: ${{ runner.temp }}/ssh-manager-build-home
          USERPROFILE: ${{ runner.temp }}/ssh-manager-build-home
        run: |
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          npm run build

      - name: Build Electron app (macOS)
        if: matrix.target == 'mac'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # macOS GitHub runners default to ulimit -n 256, and `ulimit -n`
        # alone gets silently clamped to the kernel per-process cap (~24K).
        # `sudo launchctl limit maxfiles` raises the kernel limit first;
        # `ulimit -Sn` then takes effect for this shell.
        run: |
          sudo launchctl limit maxfiles 65536 200000 || true
          ulimit -Hn 65536 2>/dev/null || true
          ulimit -Sn 65536
          echo "ulimit -n is now: $(ulimit -n)"
          npx electron-builder --mac --x64 --arm64 --publish always

      - name: Build Electron app (Windows)
        if: matrix.target == 'win'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

  release-notes:
    name: Update release notes from CHANGELOG.md
    needs: build
    # Run as long as the macOS build succeeded (Windows is allowed to fail).
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract changelog section for this tag
        id: extract
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Looking for ## [${VERSION}] in CHANGELOG.md"
          # Pull lines between "## [VERSION]" and the next "## ["
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > /tmp/notes.md

          if [ ! -s /tmp/notes.md ]; then
            echo "No CHANGELOG entry for version ${VERSION} — skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Trim trailing blank lines
          sed -i -e :a -e '/^\s*$/{$d;N;ba' -e '}' /tmp/notes.md

          echo "----- notes preview -----"
          cat /tmp/notes.md
          echo "-------------------------"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update release notes
        if: steps.extract.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file /tmp/notes.md
